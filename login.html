<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpeedBurger | Login Administrador</title>
  <link rel="icon" type="image/png" href="img/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at top left, #2e0a0a 0%, #111 50%, #1a1a1a 100%);
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-logo img { width: 70px; margin-bottom: 10px; }
    .login-logo h2 {
      font-family: 'Oswald', sans-serif;
      font-size: 1.8rem;
      color: #fff;
    }
    .login-logo h2 span { color: var(--rojo); }
    .login-logo p { color: #666; font-size: 0.85rem; margin-top: 4px; }

    .login-card {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 16px;
      padding: 40px 35px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .login-card h3 {
      font-family: 'Oswald', sans-serif;
      font-size: 1.5rem;
      color: #fff;
      margin-bottom: 6px;
    }
    .login-card .login-sub {
      color: #666;
      font-size: 0.85rem;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      color: #ccc;
      font-size: 0.85rem;
      margin-bottom: 7px;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 13px 15px;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s;
    }
    .form-group input:focus { border-color: var(--rojo); }

    .btn-login {
      width: 100%;
      background: var(--rojo);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-family: 'Oswald', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      margin-top: 8px;
    }
    .btn-login:hover { background: var(--rojo-oscuro); transform: translateY(-2px); }

    .error-msg {
      display: none;
      background: rgba(217,4,41,0.15);
      border: 1px solid var(--rojo);
      border-radius: 8px;
      padding: 10px 14px;
      color: #ff6b6b;
      font-size: 0.85rem;
      margin-top: 14px;
      text-align: center;
    }
    .error-msg.visible { display: block; }

    .login-hint {
      text-align: center;
      margin-top: 20px;
      color: #444;
      font-size: 0.78rem;
    }
    .login-hint span { color: #666; }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #555;
      font-size: 0.83rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--amarillo); }
  </style>
</head>

<body>

  <div class="login-wrapper">
    <div class="login-logo">
      <img src="img/logo.png" alt="SpeedBurger Logo" />
      <h2>Speed<span>Burger</span></h2>
      <p>Panel de Administración</p>
    </div>

    <div class="login-card">
      <h3>🔐 Iniciar Sesión</h3>
      <p class="login-sub">Ingresa tus credenciales para acceder al panel admin.</p>

      <form id="form-login" onsubmit="iniciarSesion(event)">
        <div class="form-group">
          <label for="usuario">👤 Usuario</label>
          <input type="text" id="usuario" placeholder="Ingresa tu usuario" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="contrasena">🔑 Contraseña</label>
          <input type="password" id="contrasena" placeholder="Ingresa tu contraseña" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-login">INGRESAR AL PANEL</button>
        <div class="error-msg" id="error-msg">❌ Usuario o contraseña incorrectos</div>
      </form>

      <div class="login-hint">
        <span>Usuario: <strong>admin</strong> &nbsp;|&nbsp; Contraseña: <strong>admin123</strong></span>
      </div>
    </div>

    <a href="index.html" class="back-link">← Volver al sitio</a>
  </div>

  <script>
    // Si ya está logueado, ir directo al panel
    if (sessionStorage.getItem('sb_admin_auth') === 'true') {
      window.location.href = 'admin.html';
    }

    function iniciarSesion(e) {
      e.preventDefault();
      const usuario = document.getElementById('usuario').value.trim();
      const pass = document.getElementById('contrasena').value;
      const errorMsg = document.getElementById('error-msg');

      // Credenciales hardcodeadas (en un proyecto real vendrían del backend)
      if (usuario === 'admin' && pass === 'admin123') {
        sessionStorage.setItem('sb_admin_auth', 'true');
        window.location.href = 'admin.html';
      } else {
        errorMsg.classList.add('visible');
        document.getElementById('contrasena').value = '';
        document.getElementById('contrasena').focus();
        setTimeout(() => errorMsg.classList.remove('visible'), 3000);
      }
    }
  </script>

</body>
</html>
