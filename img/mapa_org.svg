<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
  <defs>
    <style>
      .bg { fill: #1a1a1a; }
      .box { fill: #1e1e1e; rx: 12; ry: 12; stroke: #D90429; stroke-width: 3; }
      .text-name { font-family: 'Oswald', 'Arial', sans-serif; font-size: 18px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .text-role { font-family: 'Arial', sans-serif; font-size: 15px; font-weight: bold; fill: #FFBE00; text-anchor: middle; }
      .text-desc { font-family: 'Arial', sans-serif; font-size: 13px; fill: #cccccc; text-anchor: middle; }
      .line { stroke: #D90429; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1000" height="640" rx="20" ry="20"/>

  <!-- Líder -->
  <rect class="box" x="335" y="40" width="330" height="175" />
  <text class="text-name" x="500" y="75">Kelvin Jesus Acevedo Huarachi</text>
  <text class="text-role" x="500" y="100">Líder del Proyecto</text>
  <text class="text-desc" x="500" y="130">• Supervisor General del Código</text>
  <text class="text-desc" x="500" y="150">• Diseño Contenedores (Hero/Inicio)</text>
  <text class="text-desc" x="500" y="170">• Estructura Principal HTML/CSS</text>
  <text class="text-desc" x="500" y="190">• Formulario y Mapa Interactivo</text>

  <!-- Linea Vertical Central -->
  <path class="line" d="M500 215 L500 270" />
  <!-- Linea Horizontal Distribución -->
  <path class="line" d="M166 270 L833 270" />

  <!-- Conectores hacia abajo -->
  <path class="line" d="M166 270 L166 320" />
  <path class="line" d="M500 270 L500 320" />
  <path class="line" d="M833 270 L833 320" />

  <!-- Desarrollador 1 (Juan) -->
  <rect class="box" x="16" y="320" width="300" height="175" />
  <text class="text-name" x="166" y="355">Castillo Sullón Juan Pablo</text>
  <text class="text-role" x="166" y="380">Desarrollador Frontend</text>
  <text class="text-desc" x="166" y="410">• Creación y Diseño del Footer</text>
  <text class="text-desc" x="166" y="430">• Enlaces de Redes Sociales</text>
  <text class="text-desc" x="166" y="450">• Componentes Globales e Iconos</text>
  <text class="text-desc" x="166" y="470">• Login y Autenticación</text>

  <!-- Desarrollador 2 (Angel) -->
  <rect class="box" x="350" y="320" width="300" height="175" />
  <text class="text-name" x="500" y="355">Campusano Solis Angel Leonel</text>
  <text class="text-role" x="500" y="380">Desarrollador Fullstack</text>
  <text class="text-desc" x="500" y="410">• Desarrollo e iteración del Navbar</text>
  <text class="text-desc" x="500" y="430">• Efectos de Scroll y Responsividad</text>
  <text class="text-desc" x="500" y="450">• Sección Nosotros y Perfiles (CVs)</text>
  <text class="text-desc" x="500" y="470">• Panel Admin y CRUD</text>

  <!-- Desarrollador 3 (Paolo) -->
  <rect class="box" x="683" y="320" width="300" height="175" />
  <text class="text-name" x="833" y="355">Añorga Pinedo Paolo Alexander</text>
  <text class="text-role" x="833" y="380">Desarrollador y Diseñador</text>
  <text class="text-desc" x="833" y="410">• Menú de Categorías de Productos</text>
  <text class="text-desc" x="833" y="430">• Sistema Interactivo de Filtros</text>
  <text class="text-desc" x="833" y="450">• Creación del Wireframe</text>
  <text class="text-desc" x="833" y="470">• Carrito y Lógica UI</text>

</svg>
